[project]
name = "voxshift"
version = "0.1.0"
description = "Realtime AI voice conversion for PipeWire/PulseAudio"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy>=1.26,<2",
    "scipy>=1.13,<2",
    "soundfile>=0.13",
    "soxr>=0.5",
    "librosa>=0.10.2,<0.11",
    "einops>=0.8",
    "faiss-cpu>=1.13,<2",
    "praat-parselmouth>=0.4.5",
    "huggingface-hub>=0.25",
    "safetensors",
    "transformers>=4.49,<4.50",
    "local-attention>=1.11",
    "scikit-learn>=1.6,<2",
    "tensorboard",
    "matplotlib",
    "x-transformers==2.2.11",
    "av>=15.1,<16",
    "ffmpeg-python",
    "pyyaml",
    "tqdm",
    "gdown",
    "PySide6-Essentials",
]

[project.optional-dependencies]
dev = ["pytest", "faster-whisper", "jiwer"]

[project.scripts]
voxshift = "voxshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
